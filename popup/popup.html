<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Video Downloader</h1>
  </header>
  
  <div id="content">
    <div id="loading">Scanning for videos...</div>
    
    <div id="no-videos" style="display: none;">
      <p>No videos found on this page.</p>
      <button id="rescan-button">Rescan Page</button>
    </div>
    
    <div id="videos-container" style="display: none;">
      <p>Found <span id="video-count">0</span> videos on this page:</p>
      <div id="videos-list"></div>
    </div>
  </div>
  
  <footer>
    <p>Note: This extension respects website terms. Some videos may not be downloadable.</p>
  </footer>
  
  <script src="popup.js"></script>
</body>
</html>
